apply plugin: 'com.android.application'
// REMOVED THE FOLLOWING LINE WHICH WAS CAUSING THE ERROR:
// implementation 'com.thear7tofdev.edmodo:android-image-cropper:2.8.0' // This line was misplaced and redundant

android {
    compileSdkVersion 35
    def gitUrl = getRepositoryURL()

    namespace 'com.zendalona.zTextGrab'

    defaultConfig {
        applicationId "com.zendalona.zTextGrab"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 21
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "github_url", gitUrl
        resValue "string", "github_parameter_url", gitUrl+"/blob/master/parameters.md"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {

        release {
            resValue "string", "app_name", "z.TextGrab"
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }

        debug {
            def workingBranch = getGitWorkingBranch()
            def normalizedWorkingBranch = workingBranch.replaceFirst("^[^A-Za-z]+", "").replaceAll("[^0-9A-Za-z]+", "")

            if (normalizedWorkingBranch.isEmpty() || workingBranch == "master" || workingBranch == "dev") {
                applicationIdSuffix ".dev"
                resValue "string", "app_name", "z.TextGrab Dev"
            } else {
                archivesBaseName = 'OCR_' + normalizedWorkingBranch
                applicationIdSuffix ".dev." + normalizedWorkingBranch
                resValue "string", "app_name", "z.TextGrab"
            }

            minifyEnabled false
            shrinkResources false
            zipAlignEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['.jar', '.aar'])
    // REMOVED: implementation project(':cropper') - This local module is being replaced

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // This is the correct Image Cropper Library that you are using and is correctly placed
    implementation 'com.vanniktech:android-image-cropper:4.6.0' // As of June 2025, 4.6.0 is a stable and recent version

    // Add this line if it's not present, or ensure it's correct
//    implementation 'com.github.CanHub:Android-Image-Cropper:4.5.0'

    // Tesseract dependencies
    implementation 'cz.adaptech.tesseract4android:tesseract4android-openmp:4.3.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // NEW: SwipeRefreshLayout dependency
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' // Stable version

    // NEW: Lifecycle Runtime dependency (for Lifecycle.State)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0' // Or the latest stable version

    implementation 'com.google.code.gson:gson:2.8.9' // Or the latest stable version

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

}

static String getGitWorkingBranch() {
    try {
        def gitProcess = "git rev-parse --abbrev-ref HEAD".execute()
        gitProcess.waitFor()
        if (gitProcess.exitValue() == 0) {
            return gitProcess.text.trim()
        } else {
            // .git not present
            return ""
        }
    } catch (IOException ignored) {
        // git is not installed
        return ""
    }
}

static String getRepositoryURL() {
    try {
        def gitProcess = "git config --get remote.origin.url".execute()
        gitProcess.waitFor()
        if (gitProcess.exitValue() == 0) {
            def remoteUrl = gitProcess.text.trim()
            if (remoteUrl.startsWith("git@")) {
                remoteUrl = remoteUrl.replace("git@", "https://").replace(":", "/")
            }
            if (remoteUrl.endsWith(".git")) {
                remoteUrl = remoteUrl.substring(0, remoteUrl.length() - 4)
            }
            return remoteUrl
        } else {
            return ""
        }
    } catch (IOException ignored) {
        return ""
    }
}